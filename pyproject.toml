[project]
name = "fundrag"
version = "0.2.0"
description = "Agentic RAG research assistant for EU retail funds and ETFs, built on PRIIPs KIDs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tamas Gabor" }]
dependencies = [
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fundrag = "fundrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
